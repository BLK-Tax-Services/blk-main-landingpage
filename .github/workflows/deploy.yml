name: Deploy Landing page app to VPS

on:
  push:
    branches:
      - production

jobs:
  landing-page-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create .env File for Build
        run: |
          cat << 'ENVEOF' > .env
          ${{ secrets.ENV_FILE_CONTENTS }}
          ENVEOF

      - name: Install and Build Landing page
        run: |
          npm ci
          npm run build

      # With output:"standalone", we ship the self-contained standalone dir
      # plus static assets and public — no node_modules needed on the VPS.
      - name: Prepare standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Upload Built Frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./.next/standalone/"
          target: "/home/blk/landing"
          overwrite: true
          port: 22

      - name: Restart PM2 Services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22

            DEPLOY_DIR="/home/blk/landing/.next/standalone"

            cd "$DEPLOY_DIR" || { echo "❌ Standalone dir not found at $DEPLOY_DIR"; exit 1; }

            # Write .env next to server.js so Next.js picks it up
            cat << 'ENVEOF' > .env
            ${{ secrets.ENV_FILE_CONTENTS }}
            ENVEOF
            chmod 600 .env

            echo "🛑 Stopping old PM2 process and freeing port 3000..."
            pm2 stop landing 2>/dev/null || true
            pm2 delete landing 2>/dev/null || true
            # Kill any stale process still holding port 3000
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 2

            echo "🚀 Starting landing with standalone server.js..."
            pm2 start server.js --name landing --cwd "$DEPLOY_DIR"
            pm2 save

            # Give it 5 seconds to stabilise, then show status + recent logs
            sleep 5
            pm2 status
            pm2 logs landing --lines 30 --nostream

            STATUS=$(pm2 jlist | node -e "
              const list = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              const app = list.find(p => p.name === 'landing');
              process.stdout.write(app ? app.pm2_env.status : 'not_found');
            ")
            echo "landing status: $STATUS"
            [ "$STATUS" = "online" ] || { echo "❌ PM2 process is not online after deploy"; exit 1; }

            echo "✅ Successfully deployed landing page"
